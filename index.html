<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ISSF 訓練系統 (PP520 快門優化版)</title>
<style>
/* --- 全域設定 --- */
* { box-sizing: border-box; }
body { margin: 0; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; touch-action: none; color: white; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #000; cursor: crosshair; }
#videoSource { display: none; }
#gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; }
#ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; padding: 15px; }

/* --- 計分與控制項樣式 --- */
.score-panel { position: absolute; top: max(15px, env(safe-area-inset-top)); left: max(15px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 8px; pointer-events: auto; width: min(40vw, 260px); max-height: 55vh; z-index: 10; }
.total-score-box { color: #ffd700; font-size: clamp(20px, 4vw, 28px); font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); background: rgba(0,0,0,0.7); padding: 8px; border-radius: 12px; border: 2px solid #ffd700; text-align: center; }
.history-container { background: rgba(0,0,0,0.6); border-radius: 12px; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 6px; backdrop-filter: blur(4px); }
.series-block { background: rgba(255,255,255,0.08); border-radius: 6px; padding: 6px; border: 1px solid #444; }
.series-header { display: flex; justify-content: space-between; font-size: 11px; color: #bbb; margin-bottom: 4px; border-bottom: 1px solid #555; }
.series-shots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.shot-badge { background: #333; color: #fff; text-align: center; border-radius: 4px; font-size: 12px; padding: 3px 0; font-weight: bold; }

.action-bar { position: absolute; top: max(15px, env(safe-area-inset-top)); right: max(15px, env(safe-area-inset-right)); display: flex; gap: 6px; pointer-events: auto; z-index: 110; }
.btn-action { background: rgba(60, 60, 60, 0.8); border: 1px solid rgba(255, 255, 255, 0.3); color: white; padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: bold; }
#btn-toggle-shooting.active { border-color: #f00; color: #fff; background: rgba(200, 0, 0, 0.8); }

/* --- 參數面板 --- */
.floating-panel { position: absolute; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); border-radius: 12px; border: 1px solid #555; pointer-events: auto; z-index: 100; overflow: hidden; width: 310px; bottom: 25px; left: 50%; transform: translateX(-50%); }
.panel-header { background: #2a2a2a; padding: 6px; cursor: pointer; border-bottom: 1px solid #444; text-align: center; }
.panel-content { padding: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow-y: auto; }
.control-group { display: flex; align-items: center; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
.control-group label { width: 70px; color: #ccc; }
.control-group input[type=range] { flex-grow: 1; accent-color: #0f0; margin: 0 8px; }
.control-group span { width: 40px; text-align: right; color: #0f0; font-family: monospace; }
.btn-adj { background: #333; color: white; border: 1px solid #555; border-radius: 4px; width: 24px; height: 24px; cursor: pointer; }

/* --- 其他 --- */
#start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; }
#start-btn { padding: 15px 40px; font-size: 20px; background: #ffd700; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div id="container">
    <video id="videoSource" playsinline autoplay muted></video>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="score-panel">
            <div class="total-score-box">總分: <span id="total-score">0</span></div>
            <div class="history-container" id="history-container"></div>
        </div>
        
        <div class="action-bar">
            <button class="btn-action" id="btn-toggle-voice">🔇 語音(關)</button>
            <button class="btn-action" id="btn-toggle-shooting">▶ 開始射擊</button>
            <button class="btn-action" id="btn-reset">↺ 重置</button>
            <button class="btn-action" id="btn-screenshot">📷 下載</button>
        </div>

        <div class="floating-panel" id="params-panel">
            <div class="panel-header">🎯 系統參數設定</div>
            <div class="panel-content">
                <div class="control-group">
                    <label>鏡頭縮放</label>
                    <button class="btn-adj" data-target="range-zoom" data-dir="-1">-</button>
                    <input type="range" id="range-zoom" min="1.0" max="10.0" step="0.1" value="1.0">
                    <button class="btn-adj" data-target="range-zoom" data-dir="1">+</button>
                    <span id="val-zoom">1.0x</span>
                </div>
                <div class="control-group">
                    <label>絕對亮度</label>
                    <button class="btn-adj" data-target="range-bright" data-dir="-1">-</button>
                    <input type="range" id="range-bright" min="0" max="255" value="100">
                    <button class="btn-adj" data-target="range-bright" data-dir="1">+</button>
                    <span id="val-bright">100</span>
                </div>
                <div class="control-group">
                    <label style="color: #00bcd4;">曝光補償</label>
                    <button class="btn-adj" data-target="range-exposure" data-dir="-1">-</button>
                    <input type="range" id="range-exposure" min="-3" max="3" step="0.5" value="0">
                    <button class="btn-adj" data-target="range-exposure" data-dir="1">+</button>
                    <span id="val-exposure" style="color: #00bcd4;">0</span>
                </div>
                <div class="control-group">
                    <label>靶紙大小</label>
                    <button class="btn-adj" data-target="range-target-scale" data-dir="-1">-</button>
                    <input type="range" id="range-target-scale" min="0.3" max="2.0" step="0.05" value="0.7">
                    <button class="btn-adj" data-target="range-target-scale" data-dir="1">+</button>
                    <span id="val-target-scale">0.7</span>
                </div>
                <div class="control-group">
                    <label>紅光純度</label>
                    <button class="btn-adj" data-target="range-ratio" data-dir="-1">-</button>
                    <input type="range" id="range-ratio" min="1.0" max="3.0" step="0.1" value="1.2">
                    <button class="btn-adj" data-target="range-ratio" data-dir="1">+</button>
                    <span id="val-ratio">1.2</span>
                </div>
            </div>
        </div>
    </div>

    <div id="start-overlay">
        <h1 style="color: #ffd700;">PP520 訓練系統</h1>
        <button id="start-btn">允許權限並啟動</button>
    </div>
</div>

<script>
let videoStream = null;
let videoTrack = null;
const video = document.getElementById('videoSource');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

const CONFIG = {
    brightnessThreshold: 100,
    exposureCompensation: 0,
    targetScale: 0.7,
    zoomLevel: 1.0,
    colorRatio: 1.2
};

// 啟動相機
document.getElementById('start-btn').addEventListener('click', async () => {
    try {
        videoStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: 1280, height: 720 }
        });
        video.srcObject = videoStream;
        videoTrack = videoStream.getVideoTracks()[0];
        document.getElementById('start-overlay').style.display = 'none';
        initApp();
    } catch (err) {
        alert("無法啟動相機: " + err);
    }
});

function initApp() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    requestAnimationFrame(processFrame);
}

// 監聽所有滑桿與按鈕
const ranges = {
    zoom: { id: 'range-zoom', valId: 'val-zoom', key: 'zoomLevel', suffix: 'x' },
    bright: { id: 'range-bright', valId: 'val-bright', key: 'brightnessThreshold' },
    exposure: { id: 'range-exposure', valId: 'val-exposure', key: 'exposureCompensation' },
    targetScale: { id: 'range-target-scale', valId: 'val-target-scale', key: 'targetScale' },
    ratio: { id: 'range-ratio', valId: 'val-ratio', key: 'colorRatio' }
};

Object.values(ranges).forEach(cfg => {
    const el = document.getElementById(cfg.id);
    const valEl = document.getElementById(cfg.valId);
    el.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        CONFIG[cfg.key] = val;
        valEl.textContent = val + (cfg.suffix || '');
        
        // 如果是縮放或曝光，即時套用至硬體
        if (cfg.key === 'zoomLevel' || cfg.key === 'exposureCompensation') {
            applyHardwareConstraints();
        }
    });
});

// 微調按鈕邏輯
document.querySelectorAll('.btn-adj').forEach(btn => {
    btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const dir = parseInt(btn.getAttribute('data-dir'));
        const input = document.getElementById(targetId);
        input.value = parseFloat(input.value) + (parseFloat(input.step || 1) * dir);
        input.dispatchEvent(new Event('input'));
    });
});

async function applyHardwareConstraints() {
    if (!videoTrack) return;
    try {
        const capabilities = videoTrack.getCapabilities();
        const constraints = { advanced: [] };
        
        const settings = {};
        if (capabilities.zoom) {
            settings.zoom = CONFIG.zoomLevel;
        }
        if (capabilities.exposureCompensation) {
            settings.exposureCompensation = CONFIG.exposureCompensation;
        }
        
        if (Object.keys(settings).length > 0) {
            constraints.advanced.push(settings);
            await videoTrack.applyConstraints(constraints);
        }
    } catch (e) {
        console.warn("硬體不支援此項調整");
    }
}

function processFrame() {
    // 繪製影像與處理邏輯（簡化版示意）
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // 繪製虛擬靶紙 (ISSF 標準)
    drawTarget();
    
    requestAnimationFrame(processFrame);
}

function drawTarget() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const baseR = Math.min(canvas.width, canvas.height) * 0.4 * CONFIG.targetScale;
    
    ctx.save();
    ctx.globalAlpha = 0.5;
    for (let i = 1; i <= 10; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, baseR * (11 - i) / 10, 0, Math.PI * 2);
        ctx.strokeStyle = i >= 7 ? "white" : "black";
        ctx.stroke();
        if (i >= 7) {
            ctx.fillStyle = "black";
            ctx.fill();
        }
    }
    ctx.restore();
}

// 其餘計分與重置邏輯...
document.getElementById('btn-reset').onclick = () => {
    if(confirm("確定重置所有成績？")) location.reload();
};
</script>

</body>
</html>
